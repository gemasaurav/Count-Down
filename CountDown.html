<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Count Down • CD</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0a0a12; --card:#12121f; --accent:#00f5d4;
      --text:#e0e0ff; --muted:#8a8aaa; --danger:#ff2e63; --success:#00f5d4;
      --glow:0 0 12px rgba(0,245,212,.6),0 0 24px rgba(0,245,212,.3);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;overflow-x:hidden;font-family:'Rajdhani',system-ui,sans-serif;background:var(--bg);color:var(--text)}
    .bg-glow{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(0,245,212,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(123,44,191,.1) 0%,transparent 50%);pointer-events:none;z-index:0}
    .container{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100%;padding:16px;padding-bottom:40px}
    .screen{display:none;animation:fadeIn .3s ease}
    .screen.active{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:2.6rem;letter-spacing:2px;text-align:center;margin-bottom:4px}
    .logo span{color:var(--accent);text-shadow:var(--glow)}
    .glow-text{font-family:'Orbitron',sans-serif;color:var(--accent);text-shadow:var(--glow)}
    .tagline{text-align:center;color:var(--muted);font-size:1rem;margin-bottom:24px}
    .big-btn{background:var(--card);border:1px solid rgba(0,245,212,.25);border-radius:16px;padding:18px 16px;color:var(--text);font-family:'Orbitron',sans-serif;font-size:1.05rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;width:100%}
    .big-btn:active{transform:scale(.97)}
    .primary-btn,.secondary-btn{font-family:'Orbitron',sans-serif;font-weight:600;border:none;border-radius:12px;padding:14px 20px;font-size:1rem;cursor:pointer}
    .primary-btn{background:linear-gradient(135deg,#00f5d4,#00c4a7);color:#0a0a12;box-shadow:0 0 16px rgba(0,245,212,.4)}
    .primary-btn:active{transform:scale(.97)}
    .secondary-btn{background:transparent;color:var(--accent);border:1px solid rgba(0,245,212,.4)}
    .full{width:100%;margin-top:12px}
    input[type=text],input[type=number]{width:100%;background:var(--card);border:1px solid rgba(0,245,212,.25);border-radius:12px;padding:13px 15px;color:var(--text);font-size:1.1rem;font-family:'Rajdhani',sans-serif;outline:none}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,245,212,.2)}
    .hidden{display:none!important}
    .header-sm{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .back-btn{background:none;border:none;color:var(--accent);font-size:1.5rem;cursor:pointer;padding:4px 8px}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:5px;font-weight:600}
    .questions-list{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
    .q-item{background:var(--card);border:1px solid rgba(0,245,212,.15);border-radius:14px;padding:12px;position:relative}
    .q-item .q-num{font-family:'Orbitron',sans-serif;color:var(--accent);font-size:.85rem;margin-bottom:6px}
    .q-item input{width:100%;margin-bottom:7px}
    .q-item .remove-q{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--danger);font-size:1.2rem;cursor:pointer}
    .share-box{margin-top:18px;background:var(--card);border:1px solid rgba(0,245,212,.3);border-radius:14px;padding:16px;text-align:center}
    .link-row{display:flex;gap:8px;margin:12px 0}
    .link-row input{font-size:.78rem}
    .link-row button{background:var(--accent);color:#0a0a12;border:none;border-radius:8px;padding:0 14px;font-weight:700;cursor:pointer;white-space:nowrap}
    .hint{color:var(--muted);font-size:.88rem;margin-top:8px;line-height:1.4}
    .name-start{margin-top:30px;text-align:center}
    .name-start h2{font-family:'Orbitron',sans-serif;font-size:1.3rem;margin-bottom:8px}
    .name-start p{color:var(--muted);margin-bottom:20px;font-size:.95rem}
    .name-start input{text-align:center;font-size:1.2rem;margin-bottom:16px}
    .play-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .quiz-title{font-size:1.05rem;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .timer-box{background:rgba(0,245,212,.1);border:1px solid rgba(0,245,212,.4);border-radius:12px;padding:5px 12px;text-align:center;min-width:68px}
    .timer-label{display:block;font-size:.6rem;color:var(--muted);letter-spacing:1px}
    .timer-value{font-family:'Orbitron',sans-serif;font-size:1.5rem;font-weight:700;color:var(--accent);text-shadow:var(--glow)}
    .timer-value.low{color:var(--danger);text-shadow:0 0 12px rgba(255,46,99,.6)}
    .score-strip{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:12px}
    .potential strong{color:var(--accent);font-family:'Orbitron',sans-serif}
    .question-card{background:var(--card);border:1px solid rgba(0,245,212,.2);border-radius:16px;padding:16px 14px;margin-bottom:16px;min-height:85px;display:flex;align-items:center;justify-content:center}
    .question-text{font-size:1.15rem;font-weight:500;text-align:center;line-height:1.4}
    .answer-area{display:flex;flex-direction:column;gap:10px;position:sticky;bottom:0;background:var(--bg);padding-bottom:6px}
    #answer-input{font-size:1.15rem;text-align:center}
    .feedback{margin-top:12px;text-align:center;font-size:1.1rem;font-weight:600;padding:11px;border-radius:12px}
    .feedback.correct{background:rgba(0,245,212,.15);color:var(--success);border:1px solid var(--success)}
    .feedback.wrong{background:rgba(255,46,99,.12);color:var(--danger);border:1px solid var(--danger)}
    .final-score-box{text-align:center;margin:18px 0}
    .final-score{font-family:'Orbitron',sans-serif;font-size:4.6rem;font-weight:900;color:var(--accent);text-shadow:var(--glow);line-height:1}
    #result-msg{color:var(--muted);margin-top:6px}
    .leaderboard-card{background:var(--card);border:1px solid rgba(0,245,212,.2);border-radius:16px;padding:14px;margin-bottom:16px}
    .leaderboard-card h3{text-align:center;margin-bottom:10px;font-size:1rem}
    .leaderboard{display:flex;flex-direction:column;gap:7px;max-height:280px;overflow-y:auto}
    .lb-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(0,0,0,.25);border-radius:10px;font-size:.98rem}
    .lb-rank{font-family:'Orbitron',sans-serif;font-weight:700;width:26px;color:var(--accent)}
    .lb-name{flex:1;font-weight:600}
    .lb-score{font-family:'Orbitron',sans-serif;font-weight:700;color:var(--accent)}
    .note{text-align:center;color:var(--muted);font-size:.85rem;margin-top:12px;line-height:1.4}
    @media(max-height:600px){.question-card{min-height:60px;padding:12px}.question-text{font-size:1.05rem}}
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">

    <!-- LANDING -->
    <section id="landing" class="screen active">
      <header>
        <h1 class="logo glow-text">COUNT<span>DOWN</span></h1>
        <p class="tagline">Answer. Survive. Climb the board.</p>
      </header>
      <button class="big-btn" onclick="showScreen('admin')">
        <span>⚙</span><span>Create Quiz</span>
      </button>
      <p class="note">No setup needed. Create quiz → copy link → share.</p>
    </section>

    <!-- ADMIN -->
    <section id="admin" class="screen">
      <header class="header-sm">
        <button class="back-btn" onclick="showScreen('landing')">←</button>
        <h2 class="glow-text">Create Quiz</h2>
      </header>

      <div class="form-group">
        <label>Quiz Name</label>
        <input type="text" id="quiz-name" placeholder="e.g. Friday Night Trivia" maxlength="40">
      </div>

      <div class="form-group">
        <label>Seconds per question</label>
        <input type="number" id="time-per-q" value="30" min="5" max="120">
      </div>

      <div id="questions-list" class="questions-list"></div>
      <button class="secondary-btn full" onclick="addQuestion()">+ Add Question</button>

      <button class="primary-btn full" id="save-btn" onclick="saveQuiz()" style="margin-top:16px">SAVE & GET LINK</button>

      <div id="share-box" class="share-box hidden">
        <p><strong>Share this link</strong></p>
        <div class="link-row">
          <input type="text" id="share-link" readonly>
          <button onclick="copyLink()">COPY</button>
        </div>
        <p class="hint">Anyone who opens this link can play the quiz.</p>
      </div>
    </section>

    <!-- NAME -->
    <section id="name-entry" class="screen">
      <div class="name-start">
        <h2 class="glow-text" id="quiz-title-name">Quiz</h2>
        <p>Enter your name to start</p>
        <input type="text" id="player-name" placeholder="Your name" maxlength="20" autocomplete="off">
        <button class="primary-btn full" onclick="startWithName()">START QUIZ</button>
      </div>
    </section>

    <!-- PLAY -->
    <section id="play" class="screen">
      <div class="play-header">
        <div class="quiz-title glow-text" id="play-title">Quiz</div>
        <div class="timer-box">
          <span class="timer-label">TIME</span>
          <span class="timer-value" id="timer">30</span>
        </div>
      </div>
      <div class="score-strip">
        <span>Q <span id="q-num">1</span>/<span id="q-total">10</span></span>
        <span class="potential">Score if correct: <strong id="potential-score">10</strong></span>
      </div>
      <div class="question-card">
        <p id="question-text" class="question-text"></p>
      </div>
      <div class="answer-area">
        <input type="text" id="answer-input" placeholder="Type answer (1-2 words)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="primary-btn" onclick="submitAnswer()">SUBMIT</button>
      </div>
      <div id="feedback" class="feedback hidden"></div>
    </section>

    <!-- RESULT -->
    <section id="result" class="screen">
      <header class="header-sm">
        <h2 class="glow-text">Your Score</h2>
      </header>
      <div class="final-score-box">
        <div class="final-score" id="final-score">0</div>
        <p id="result-msg"></p>
      </div>
      <div class="leaderboard-card">
        <h3 class="glow-text">LEADERBOARD (this device)</h3>
        <div id="leaderboard" class="leaderboard"></div>
      </div>
      <button class="secondary-btn full" onclick="location.reload()">PLAY AGAIN / HOME</button>
    </section>
  </div>

  <script>
    let currentQuiz = null;
    let currentQIndex = 0;
    let timerInterval = null;
    let timeLeft = 30;
    let timePerQ = 30;
    let tempQuestions = [];
    let playerName = '';
    let quizKey = '';

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      if (id === 'admin') renderQuestions();
    }

    function addQuestion() {
      if (tempQuestions.length >= 10) { alert('Maximum 10 questions'); return; }
      tempQuestions.push({q:'',a:''});
      renderQuestions();
    }

    function removeQuestion(i) {
      tempQuestions.splice(i,1);
      renderQuestions();
    }

    function renderQuestions() {
      const list = document.getElementById('questions-list');
      list.innerHTML = '';
      if (tempQuestions.length === 0) tempQuestions.push({q:'',a:''});
      tempQuestions.forEach((item,i) => {
        const div = document.createElement('div');
        div.className = 'q-item';
        div.innerHTML = `
          <div class="q-num">Q${i+1}</div>
          <button class="remove-q" onclick="removeQuestion(${i})">×</button>
          <input type="text" placeholder="Question text" value="${(item.q||'').replace(/"/g,'&quot;')}" oninput="tempQuestions[${i}].q=this.value">
          <input type="text" placeholder="Correct answer (1-2 words)" value="${(item.a||'').replace(/"/g,'&quot;')}" oninput="tempQuestions[${i}].a=this.value">
        `;
        list.appendChild(div);
      });
    }

    // Encode / Decode
    function encodeQuiz(obj) {
      return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
        .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    }
    function decodeQuiz(str) {
      try {
        str = str.replace(/-/g,'+').replace(/_/g,'/');
        while (str.length % 4) str += '=';
        return JSON.parse(decodeURIComponent(escape(atob(str))));
      } catch(e) { return null; }
    }

    function saveQuiz() {
      const name = document.getElementById('quiz-name').value.trim();
      if (!name) { alert('Please enter a quiz name'); return; }

      const secs = parseInt(document.getElementById('time-per-q').value,10) || 30;
      if (secs < 5 || secs > 120) { alert('Time must be between 5 and 120 seconds'); return; }

      const valid = tempQuestions.filter(q => q.q.trim() && q.a.trim());
      if (valid.length === 0) { alert('Add at least one question + answer'); return; }

      const quiz = {
        n: name,
        t: secs,
        qs: valid.map(q => ({q: q.q.trim(), a: q.a.trim().toLowerCase()}))
      };

      const encoded = encodeQuiz(quiz);
      const base = location.href.split('?')[0].split('#')[0];
      const link = base + '#q=' + encoded;

      document.getElementById('share-link').value = link;
      document.getElementById('share-box').classList.remove('hidden');
    }

    function copyLink() {
      const input = document.getElementById('share-link');
      input.select();
      navigator.clipboard.writeText(input.value).then(() => alert('Link copied!')).catch(() => alert(input.value));
    }

    function startWithName() {
      const name = document.getElementById('player-name').value.trim();
      if (!name) { alert('Please enter your name'); return; }
      playerName = name;
      currentQIndex = 0;
      document.getElementById('play-title').textContent = currentQuiz.n;
      document.getElementById('q-total').textContent = currentQuiz.qs.length;
      showScreen('play');
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(timerInterval);
      const qs = currentQuiz.qs;
      if (currentQIndex >= qs.length) { endQuiz(0); return; }

      const q = qs[currentQIndex];
      document.getElementById('q-num').textContent = currentQIndex + 1;
      document.getElementById('potential-score').textContent = Math.max(1, 11 - (currentQIndex + 1));
      document.getElementById('question-text').textContent = q.q;
      document.getElementById('answer-input').value = '';
      document.getElementById('feedback').classList.add('hidden');
      setTimeout(() => document.getElementById('answer-input').focus(), 60);

      timeLeft = timePerQ;
      updateTimer();
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          showFeedback(false);
          setTimeout(() => { currentQIndex++; loadQuestion(); }, 850);
        }
      }, 1000);
    }

    function updateTimer() {
      const el = document.getElementById('timer');
      el.textContent = timeLeft;
      el.classList.toggle('low', timeLeft <= 8);
    }

    function submitAnswer() {
      const ans = document.getElementById('answer-input').value.trim().toLowerCase();
      if (!ans) return;
      clearInterval(timerInterval);

      const correct = currentQuiz.qs[currentQIndex].a;
      const isCorrect = ans === correct || ans.replace(/\s+/g,' ') === correct;

      if (isCorrect) {
        const score = Math.max(1, 11 - (currentQIndex + 1));
        showFeedback(true, score);
        setTimeout(() => endQuiz(score), 1000);
      } else {
        showFeedback(false);
        setTimeout(() => { currentQIndex++; loadQuestion(); }, 850);
      }
    }

    function showFeedback(ok, score) {
      const fb = document.getElementById('feedback');
      fb.classList.remove('hidden','correct','wrong');
      if (ok) {
        fb.classList.add('correct');
        fb.textContent = 'CORRECT! +' + score;
      } else {
        fb.classList.add('wrong');
        fb.textContent = 'Wrong → next question';
      }
    }

    function endQuiz(score) {
      clearInterval(timerInterval);
      document.getElementById('final-score').textContent = score;
      document.getElementById('result-msg').textContent =
        score === 10 ? 'Perfect! First try!' :
        score >= 7 ? 'Great job!' :
        score >= 4 ? 'Nice effort!' :
        score > 0 ? 'You got it eventually!' : 'Better luck next time!';

      // Save to local leaderboard
      const key = 'cd_lb_' + quizKey;
      let list = JSON.parse(localStorage.getItem(key) || '[]');
      list.push({name: playerName, score, time: Date.now()});
      list.sort((a,b) => b.score - a.score || a.time - b.time);
      list = list.slice(0, 30);
      localStorage.setItem(key, JSON.stringify(list));

      showScreen('result');
      renderLeaderboard(list);
    }

    function renderLeaderboard(list) {
      const box = document.getElementById('leaderboard');
      if (!list.length) {
        box.innerHTML = '<p style="text-align:center;color:var(--muted)">No scores yet on this device</p>';
        return;
      }
      box.innerHTML = list.map((e,i) => `
        <div class="lb-row">
          <span class="lb-rank">#${i+1}</span>
          <span class="lb-name">${escapeHtml(e.name)}</span>
          <span class="lb-score">${e.score}</span>
        </div>
      `).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    // Boot
    window.addEventListener('DOMContentLoaded', () => {
      const hash = location.hash;
      if (hash.startsWith('#q=')) {
        const encoded = hash.substring(3);
        const quiz = decodeQuiz(encoded);
        if (quiz && quiz.qs) {
          currentQuiz = quiz;
          timePerQ = quiz.t || 30;
          quizKey = encoded.slice(0, 20);
          document.getElementById('quiz-title-name').textContent = quiz.n || 'Quiz';
          showScreen('name-entry');
          setTimeout(() => document.getElementById('player-name').focus(), 100);
          return;
        }
      }
      showScreen('landing');
      renderQuestions();

      document.getElementById('answer-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') submitAnswer();
      });
      document.getElementById('player-name').addEventListener('keydown', e => {
        if (e.key === 'Enter') startWithName();
      });
    });
  </script>
</body>
</html>
